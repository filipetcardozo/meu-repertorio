# Imagem do worker (contexto = raiz do repositório). Uso:
#   gcloud builds submit --config worker/cloudbuild.yaml --project avid-bricolage-313721 .
steps:
  - name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    args: ["build", "-f", "worker/Dockerfile", "-t", "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/process-playback", "."]
images: ["us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/process-playback"]
options:
  machineType: E2_HIGHCPU_8
timeout: 3600s
